<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>

    <style>

        h1{
            display: inline;
        }

        div{
            position: relative;
            background-color:blue ;

            height: 50px;
        }

        ul{
            /* list-style-type: disc;
            list-style-type: circle;
            list-style-type: square;
            list-style-type: none;
            
            list-style-position: inside;

            list-style-image: url("images/bullet_point.avif"); */

            display: inline-block;


            position: absolute;
            right: 0px;

        }

        li{
            display: inline-block;
            margin: 0px 10px;
            padding: 5px;
        }
    </style>

</head>

<body>
    <div>

        <h1>List items</h1>

        <ul>
            <li>html</li>
            <li>CSS</li>
            <li>JS</li>
            <li>python</li>
            <li>java</li>
        </ul>

    </div>
    
</body>
</html>
