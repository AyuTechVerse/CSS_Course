<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>padding and margin</title>

    <style>
        .box1{
            width: 100px;
            height: 100px;
            background-color: aqua;

            border: 2px solid black;
            border-radius: 20px;



    /*------------------ padding ------------------*/
            /* padding: 20px; */

            /* one side padding */
            /* padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px; */

            /* shorthand padding */
                /* top, right, bottum, left */
            /* padding: 10px 20px 15px 5px; */

                /* top, left/right, bottom */
            /* padding: 10px 15px 5px; */

                /* top/bottum, left/right */
            /* padding: 5px 10px; */
                
            padding: 10px;
            
        }

        /*------------------ margin ------------------*/

        #main{
            width: 260px;
            height: 150px;
            background-color: pink;

            display: flex;

            border: 2px solid black;
        }

        .box{
            width: 100px;
            height: 100px;
            background-color: aquamarine;

            border: 2px solid red;

            margin-top: 5px;
            margin-right: 5px;
            margin-bottom: 20px;
            margin-left: 20px;

            /* margin shorthand is similar to padding padiing */
            margin: 5px 10px 50px 20px;

        }
        
        #parent{
            height: 300px;
            width: 300px;
            background-color: chartreuse;

            border: 3px solid black;
            margin-top: 5px;

        }

        .child{
            height: 100px;
            width: 100px;
            background-color:darkturquoise;

            border: 2px solid red;

            /* auto makes the div in center of parent */
            margin: 2px auto;
        }

        #child1{

            padding: 20px;
            box-sizing: border-box;
        }
        #child2{
            padding: 20px;
            box-sizing: content-box;
        }

    </style>

</head>
<body>

    <Div class="box1">
        <p>
            this is box 
            neeraj and 
            varsha ki kabhi 
            ...
        </p>
    </Div>

    <Div class="box1">
        <img src="./images/cute_cat.jpg" width="100" height="100" alt="">
    </Div>


    <!-- margin learning -->
     <div id="main">
        <div class="box">box1</div>
        <div class="box">box2</div>
        <div class="box">box1</div>
        <div class="box">box2</div>

     </div>

     <!-- center div using margin -->
      <div id="parent">
        <div id="child1" class="child">box</div>
        <div id="child2" class="child">box</div>
      </div>
    
</body>
</html>
